<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Calendario académico</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head><body><div class="layout"><div class="sidebar" id="appSidebar"></div><main class="content"><div class="pageHero"><div><span class="eyebrow">PLANIFICACIÓN</span><h1>Calendario académico</h1><p class="hint">Organiza evaluaciones, clases, entregas y eventos.</p></div></div><section class="card"><form id="eventForm"><input id="evTitle" placeholder="Título del evento" required><input id="evDate" type="datetime-local" required><select id="evType"><option>Clase</option><option>Evaluación</option><option>Entrega</option><option>Evento</option></select><input id="evCourse" placeholder="Curso (opcional)"><button>Agregar evento</button></form></section><section id="events" class="calendarGrid"></section></main></div><script src="../js/utils.js"></script><script src="../js/pro.js"></script><script src="../js/logout.js"></script><script src="../js/nav.js"></script>
<script src="../js/authGuard.js"></script><script>let evs=LMS.load('eventosCalendario',[]);function render(){events.innerHTML=evs.length?evs.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map((e,i)=>`<article class="card eventCard"><span class="badge badge-primary">${LMS.escapeHTML(e.type)}</span><h3>${LMS.escapeHTML(e.title)}</h3><p>🕒 ${new Date(e.date).toLocaleString('es-CO')}</p>${e.course?`<small>${LMS.escapeHTML(e.course)}</small>`:''}<button class="btn-danger" onclick="del(${i})">Eliminar</button></article>`).join(''):LMS.emptyState('No hay eventos programados.')}eventForm.addEventListener('submit',e=>{e.preventDefault();evs.push({id:LMSPro.uid('EV'),title:evTitle.value.trim(),date:evDate.value,type:evType.value,course:evCourse.value.trim()});LMS.save('eventosCalendario',evs);LMSPro.audit('CREAR','evento',evTitle.value);LMSPro.notify('Nuevo evento',`Se programó ${evTitle.value.trim()}`);e.target.reset();render();LMS.notify('Evento agregado.')});function del(i){const x=evs[i];LMS.confirmAction(`¿Eliminar “${x.title}”?`,()=>{evs.splice(i,1);LMS.save('eventosCalendario',evs);LMSPro.audit('ELIMINAR','evento',x.title);render()})}render();</script></body></html>
