<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Evaluaciones</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="layout"><div class="sidebar" id="appSidebar"></div><main class="content"><div class="pageHero"><div><span class="eyebrow">EVALUACIÓN</span><h1>Evaluaciones</h1><p class="hint">Crea cuestionarios y controla el rendimiento académico.</p></div><span class="heroIcon"><i class="fa-solid fa-clipboard-check"></i></span></div><div class="card"><h2>Nueva evaluación</h2><form id="evaluacionForm"><select id="evaluacionCurso" required></select><input id="evaluacionTitulo" placeholder="Título de la evaluación" required><div class="questionBuilder"><input id="preguntaTexto" placeholder="Pregunta"><input id="opcion1" placeholder="Opción 1"><input id="opcion2" placeholder="Opción 2"><input id="opcion3" placeholder="Opción 3"><input id="opcion4" placeholder="Opción 4"><select id="respuestaCorrecta"><option value="0">Correcta: opción 1</option><option value="1">Correcta: opción 2</option><option value="2">Correcta: opción 3</option><option value="3">Correcta: opción 4</option></select><button id="agregarPregunta" type="button" class="btn-secondary"><i class="fa-solid fa-plus"></i> Agregar pregunta</button></div><div id="preguntasPreview"></div><button type="submit"><i class="fa-solid fa-save"></i> Guardar evaluación</button></form></div><h2>Evaluaciones creadas</h2><div id="listaEvaluaciones" class="cards"></div></main></div><script src="../js/utils.js"></script>
