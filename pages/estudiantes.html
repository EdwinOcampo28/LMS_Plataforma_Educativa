<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Gestión de Estudiantes</title>

<link rel="stylesheet" href="../css/styles.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="layout">

<!-- SIDEBAR -->

<div class="sidebar" id="appSidebar"></div>

<!-- CONTENIDO -->

<div class="content">

<h1>Gestión de Estudiantes</h1>

<!-- FORMULARIO -->

<div class="card">

<form id="estudiantesForm">

<input id="identificacion" placeholder="Identificación del estudiante" required>

<input id="nombres" placeholder="Nombres" required>

<input id="apellidos" placeholder="Apellidos" required>

<div class="select-genero">

<i class="fa-solid fa-venus-mars"></i>

<select id="genero" required>

<option value="">Seleccionar género</option>
<option value="Masculino">Masculino</option>
<option value="Femenino">Femenino</option>
<option value="Otro">Otro</option>

</select>

</div>

<input id="fechaNacimiento" type="date" required>

<input id="direccion" placeholder="Dirección" required>

<input id="telefono" placeholder="Teléfono" required>

<button type="submit">
<i class="fa-solid fa-floppy-disk"></i> Guardar Estudiante
</button>

</form>

</div>

<!-- BUSCADOR -->

<input id="buscar" placeholder="🔍 Buscar estudiante por nombre o identificación">

<!-- TABLA -->

<table>

<thead>

<tr>
<th>Identificación</th>
<th>Nombres</th>
<th>Apellidos</th>
<th>Género</th>
<th>Fecha Nacimiento</th>
<th>Dirección</th>
<th>Teléfono</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tablaestudiantes"></tbody>

</table>

</div>

</div>

<script src="../js/utils.js"></script>
<script src="../js/logout.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/authGuard.js"></script>
<script src="../js/estudiantes.js"></script>
</body>
</html>
