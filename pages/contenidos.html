<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contenidos</title>
    <link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar" id="appSidebar"></div>

    <!-- CONTENIDO -->
    <div class="content">
        <h1>Gestión de Contenidos</h1>

        <!-- FORMULARIO -->
        <div class="card">
            <h2>Agregar Contenido</h2>
            <form id="contenidoForm">
                <label>Curso</label>
                <select id="cursoContenido" required><option value="">Seleccionar curso</option></select>
                <label>Título de la lección</label>
                <input id="tituloContenido" placeholder="Ej: Introducción a Python">
                <label>Video</label>
                <input id="videoContenido" placeholder="URL del video">
                <label>Documento</label>
                <input id="documentoContenido" placeholder="Documento PDF o enlace">
                <label>Imagen</label>
                <input id="imagenContenido" placeholder="URL de la imagen">
                <label>Enlace</label>
                <input id="enlaceContenido" placeholder="Link externo">
                <button type="submit">Guardar Contenido</button>
            </form>
        </div>

        <!-- GRID DE CARDS -->
        <h2 style="margin-top:40px;">Vista de Contenidos</h2>
        <div id="contenidosCards" class="grid"></div>

    </div>

</div>
<script src="../js/utils.js"></script>
<script src="../js/logout.js"></script>
<script src="../js/authGuard.js"></script>
<script src="../js/pro.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/contenidos.js"></script>
</body>
</html>
