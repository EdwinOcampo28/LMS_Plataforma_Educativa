<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Docentes</title>

<link rel="stylesheet" href="../css/styles.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="layout">

<!-- SIDEBAR -->

<div class="sidebar" id="appSidebar"></div>

<!-- CONTENIDO -->

<div class="content">

<h1>Gestión de Docentes</h1>

<!-- FORMULARIO -->

<div class="card">

<form id="docenteForm">

<input id="codigo" placeholder="Código del docente" required>

<input id="nombres" placeholder="Nombres" required>

<input id="apellidos" placeholder="Apellidos" required>

<input id="email" type="email" placeholder="Correo electrónico" required>

<!-- TELEFONO -->

<input id="telefono" type="tel" placeholder="Número de teléfono" required>

<div class="select-area">

<i class="fa-solid fa-layer-group"></i>

<select id="area" required>

<option value="">Seleccionar área académica</option>

<option value="Matemáticas">Matemáticas</option>
<option value="Programación">Programación</option>
<option value="Bases de Datos">Bases de Datos</option>
<option value="Redes">Redes</option>
<option value="Inteligencia Artificial">Inteligencia Artificial</option>
<option value="Ciberseguridad">Ciberseguridad</option>

</select>

</div>

<button>
<i class="fa-solid fa-floppy-disk"></i> Guardar
</button>

</form>

</div>

<!-- BUSCADOR -->

<input id="buscar" placeholder="🔍 Buscar docente por nombre">

<!-- TABLA -->

<table>

<thead>

<tr>

<th>Código</th>

<th>Nombre</th>

<th>Email</th>

<th>Teléfono</th>

<th>Área</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaDocentes"></tbody>

</table>

</div>

</div>

<script src="../js/utils.js"></script>
<script src="../js/logout.js"></script>
<script src="../js/authGuard.js"></script>
<script src="../js/pro.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/docentes.js"></script>
</body>

</html>
