<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar certificado · EDUNOVA</title><link rel="stylesheet" href="css/styles.css"><style>
.verifyWrap{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at top,#eef2ff,#f8fafc 45%,#eef2f7)}.verifyCard{width:min(720px,100%);overflow:hidden;padding:0;border:1px solid #dbe4ff;box-shadow:0 25px 70px rgba(15,23,42,.12)}.verifyHead{padding:32px;background:linear-gradient(135deg,#eef2ff,#fff);text-align:center;border-bottom:1px solid #dbe4ff}.verifyLogo{font:bold 26px Arial;color:#24324a;letter-spacing:1px}.verifyLogo span{color:#b08d3a}.verifyIcon{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px double #b08d3a;color:#b08d3a;font-size:26px}.verifyBody{padding:30px}.verifyForm{display:flex;gap:10px}.verifyForm input{flex:1}.verifySuccess,.verifyFail{margin-top:22px;padding:22px;border-radius:16px;border:1px solid}.verifySuccess{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.verifyFail{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.verifyGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.verifyMetric{padding:13px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(148,163,184,.2)}.verifyMetric small{display:block;color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:1px}.verifyMetric strong{display:block;margin-top:4px;color:#172033}.verifyBack{display:inline-block;margin-top:20px;text-decoration:none;font-weight:700}@media(max-width:600px){.verifyForm{flex-direction:column}.verifyGrid{grid-template-columns:1fr}}.dark-mode .verifyWrap{background:radial-gradient(circle at top,#1d2742,#0b1120 55%,#070b14)}.dark-mode .verifyCard{background:#111827;border-color:#2b3852}.dark-mode .verifyHead{background:linear-gradient(135deg,#182033,#111827);border-color:#2b3852}.dark-mode .verifyLogo{color:#f1f5f9}.dark-mode .verifyBody{background:#111827}.dark-mode .verifyMetric{background:#172033;border-color:#2b3852}.dark-mode .verifyMetric strong{color:#f1f5f9}.dark-mode .verifySuccess{background:#10281b;color:#86efac;border-color:#28613e}.dark-mode .verifyFail{background:#321b22;color:#fda4af;border-color:#6d303d}
</style></head><body><main class="verifyWrap"><section class="card verifyCard"><header class="verifyHead"><div class="verifyIcon">★</div><div class="verifyLogo">EDUNOVA</div><span class="eyebrow">VALIDACIÓN ACADÉMICA</span><h1>Verificar certificado</h1><p class="hint">Comprueba la autenticidad y vigencia de un certificado emitido por la plataforma.</p></header><div class="verifyBody"><form id="verifyForm" class="verifyForm"><input id="certCode" placeholder="Código del certificado · CERT-..." required><button type="submit"><i class="fa-solid fa-shield-check"></i> Verificar</button></form><div id="result"></div><a class="verifyBack" href="index.html">← Volver al inicio</a></div></section></main><script src="js/utils.js"></script><script>const params=new URLSearchParams(location.search);if(params.get('codigo'))certCode.value=params.get('codigo');verifyForm.addEventListener('submit',e=>{e.preventDefault();const code=certCode.value.trim();const c=LMS.load('certificados',[]).find(x=>x.id===code);if(!c){result.innerHTML='<div class="verifyFail"><strong>✕ Certificado no encontrado</strong><p>Verifica que el código esté escrito correctamente.</p></div>';return;}if(c.revocado||c.status==='revoked'){result.innerHTML=`<div class="verifyFail"><strong>✕ Certificado revocado</strong><p>Este certificado fue emitido por el LMS, pero actualmente no está vigente.</p><div class="verifyGrid"><div class="verifyMetric"><small>Código</small><strong>${LMS.escapeHTML(c.id)}</strong></div><div class="verifyMetric"><small>Estado</small><strong>Revocado</strong></div></div></div>`;return;}const s=LMS.load('estudiantes',[]).find(x=>x.codigo===c.estudianteCodigo||x.identificacion===c.estudianteCodigo);const course=LMS.load('cursos',[]).find(x=>x.codigo===c.cursoCodigo);const nombre=`${s?.nombres||''} ${s?.apellidos||''}`.trim()||c.estudianteCodigo;result.innerHTML=`<div class="verifySuccess"><strong>✓ Certificado válido y vigente</strong><div class="verifyGrid"><div class="verifyMetric"><small>Estudiante</small><strong>${LMS.escapeHTML(nombre)}</strong></div><div class="verifyMetric"><small>Curso</small><strong>${LMS.escapeHTML(course?.nombre||c.cursoCodigo)}</strong></div><div class="verifyMetric"><small>Calificación</small><strong>${Number(c.nota)||0}%</strong></div><div class="verifyMetric"><small>Fecha de emisión</small><strong>${new Date(c.fecha).toLocaleDateString('es-CO')}</strong></div><div class="verifyMetric"><small>Código</small><strong>${LMS.escapeHTML(c.id)}</strong></div><div class="verifyMetric"><small>Estado</small><strong>Vigente</strong></div></div></div>`});if(params.get('codigo'))verifyForm.requestSubmit();</script></body></html>
