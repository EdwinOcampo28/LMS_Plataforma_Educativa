<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Datos y respaldo</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head><body><div class="layout"><div class="sidebar" id="appSidebar"></div><main class="content"><div class="pageHero"><div><span class="eyebrow">SEGURIDAD DE DATOS</span><h1>Respaldo y restauración</h1><p class="hint">Protege los datos guardados localmente.</p></div></div><div class="profileGrid"><section class="card"><h2>Crear respaldo</h2><p class="hint">Descarga un JSON con cursos, usuarios, notas, certificados y configuraciones.</p><button onclick="LMSPro.backup()">⬇ Descargar respaldo</button></section><section class="card"><h2>Restaurar respaldo</h2><p class="hint">Selecciona un archivo JSON creado por este LMS.</p><input type="file" id="restoreFile" accept="application/json,.json"><button class="btn-secondary" onclick="restaurar()">Restaurar datos</button></section></div></main></div><script src="../js/utils.js"></script><script src="../js/pro.js"></script><script src="../js/logout.js"></script><script src="../js/nav.js"></script>
<script src="../js/authGuard.js"></script><script>function restaurar(){const f=restoreFile.files[0];if(!f)return LMS.notify('Selecciona un archivo JSON.','warning');LMS.confirmAction('La restauración reemplazará los datos locales actuales. ¿Continuar?',()=>LMSPro.restore(f))}</script></body></html>
