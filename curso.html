<!-- CONTENIDO -->

<h1 id="tituloCurso"></h1>

<!-- Módulos -->
<h2>Módulos</h2>
<div id="cursoResumen" class="courseSummary"><div><span>Docente</span><strong id="cursoDocente">—</strong></div><div><span>Categoría</span><strong id="cursoCategoria">—</strong></div><div><span>Descripción</span><strong id="cursoDescripcion">—</strong></div></div>
<div id="modulos"></div>

<!-- Formulario para agregar módulo -->
<h3>Agregar / Editar Módulo</h3>
<form id="moduloForm">
<input type="text" id="moduloNombre" placeholder="Nombre módulo" required>
<button type="submit"><i class="fa-solid fa-layer-group"></i> Guardar Módulo</button>
</form>

<!-- Lecciones -->
<h2>Lecciones</h2>
<form id="leccionForm">
<select id="moduloSelect" required>
<option value="">Seleccionar módulo</option>
</select>
<input type="text" id="tituloLeccion" placeholder="Título lección" required>
<button type="submit"><i class="fa-solid fa-plus"></i> Agregar Lección</button>
</form>

</div>
</div>
