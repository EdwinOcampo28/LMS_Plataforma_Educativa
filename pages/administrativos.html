<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Administrativos</title>

<link rel="stylesheet" href="../css/styles.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar" id="appSidebar"></div>

<!-- CONTENIDO -->
<div class="content">

<div class="pageHero"><div><span class="eyebrow">SEGURIDAD</span><h1>Administrativos</h1><p class="hint">Gestiona las cuentas con acceso al panel de administración.</p></div><span class="heroIcon"><i class="fa-solid fa-shield-halved"></i></span></div>

<div class="card">
<p class="hint"><i class="fa-solid fa-circle-info"></i> Los administradores se crean aquí. Una vez registrados, desde esta sección solo se pueden eliminar; sus datos no se editan.</p>
<form id="adminForm">

<input id="identificacion" placeholder="Identificación" required>

<input id="nombres" placeholder="Nombres" required>

<input id="apellidos" placeholder="Apellidos" required>

<input id="email" type="email" placeholder="Email" required>

<input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" required>

<button type="submit">
<i class="fa-solid fa-save"></i> Guardar
</button>

</form>

</div>

<br>

<h2>Lista de Administrativos</h2>

<ul id="listaAdmins" class="cards"></ul>

</div>

</div>

<script src="../js/utils.js"></script>
<script src="../js/logout.js"></script>
<script src="../js/authGuard.js"></script>
<script src="../js/pro.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/administrativos.js"></script>
</body>

</html>
