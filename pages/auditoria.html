<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Auditoría</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="layout"><div class="sidebar" id="appSidebar"></div><main class="content"><div class="pageHero"><div><span class="eyebrow">CONTROL</span><h1>Auditoría</h1><p class="hint">Historial de acciones realizadas en EDUNOVA.</p></div><div class="heroActions"><button class="btn-outline" onclick="exportarAuditoria()"><i class="fa-solid fa-download"></i> Exportar</button><button class="btn-danger" onclick="limpiarAuditoria()"><i class="fa-solid fa-trash"></i> Limpiar historial</button></div></div><div class="card"><div class="notice"><i class="fa-solid fa-shield-halved"></i><div><strong>Historial administrativo</strong><p>Eliminar un registro solo elimina la entrada de auditoría. No elimina el dato o acción original del sistema.</p></div></div><div class="tableWrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Detalle</th><th>Acción</th></tr></thead><tbody id="audit"></tbody></table></div></div></main></div><script src="../js/utils.js"></script><script src="../js/pro.js"></script><script src="../js/logout.js"></script><script src="../js/nav.js"></script><script src="../js/authGuard.js"></script><script>
function renderAudit(){const a=LMS.load('auditoria',[]);document.getElementById('audit').innerHTML=a.length?a.map(x=>`<tr><td>${new Date(x.date).toLocaleString('es-CO')}</td><td>${LMS.escapeHTML(x.user)}</td><td><span class="badge badge-primary">${LMS.escapeHTML(x.action)}</span></td><td>${LMS.escapeHTML(x.entity)}</td><td>${LMS.escapeHTML(x.detail)}</td><td><button type="button" class="btn-danger btn-sm" data-audit-id="${LMS.escapeHTML(x.id)}" title="Eliminar registro"><i class="fa-solid fa-trash"></i></button></td></tr>`).join(''):`<tr><td colspan="6">${LMS.emptyState('Todavía no hay movimientos registrados.')}</td></tr>`}
function eliminarAudit(id){const a=LMS.load('auditoria',[]),x=a.find(v=>String(v.id)===String(id));if(!x){LMS.notify('No se encontró el registro.','warning');return;}LMS.confirmAction('¿Eliminar este registro del historial de auditoría?',()=>{const next=a.filter(v=>String(v.id)!==String(id));LMS.saveRaw('auditoria',next);window.dispatchEvent(new CustomEvent('lms:data-change',{detail:{key:'auditoria',value:next}}));renderAudit();LMS.notify('Registro de auditoría eliminado.');})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-audit-id]');if(b)eliminarAudit(b.dataset.auditId)});
function limpiarAuditoria(){const a=LMS.load('auditoria',[]);if(!a.length)return LMS.notify('No hay registros para eliminar.','warning');LMS.confirmAction('¿Eliminar todo el historial de auditoría? Esta acción no elimina cursos, notas ni certificados.',()=>{LMS.saveRaw('auditoria',[]);renderAudit();LMS.notify('Historial de auditoría limpiado.')})}
function exportarAuditoria(){const a=LMS.load('auditoria',[]);const rows=a.map(x=>[new Date(x.date).toLocaleString('es-CO'),x.user,x.action,x.entity,x.detail]);LMSPro.exportCSV('auditoria_lms.csv',['Fecha','Usuario','Accion','Entidad','Detalle'],rows);}
renderAudit();window.addEventListener('lms:data-change',e=>{if(e.detail?.key!=='auditoria')renderAudit()});</script></body></html>
