<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link rel="stylesheet" href="css/styles.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar" id="appSidebar"></div>

<!-- CONTENIDO -->

<div class="content">

<h1>Dashboard</h1>


<!-- TARJETAS ESTADISTICAS -->

<div class="stats">

<div class="statCard">
<h3>Cursos</h3>
<div class="statNumber" id="totalCursos">0</div>
<i class="fa-solid fa-book statIcon"></i>
</div>

<div class="statCard estudiantes">
<h3>Estudiantes</h3>
<div class="statNumber" id="totalEstudiantes">0</div>
<i class="fa-solid fa-user-graduate statIcon"></i>
</div>

<div class="statCard docentes">
<h3>Docentes</h3>
<div class="statNumber" id="totalDocentes">0</div>
<i class="fa-solid fa-chalkboard-user statIcon"></i>
</div>

<div class="statCard modulos">
<h3>Módulos</h3>
<div class="statNumber" id="totalModulos">0</div>
<i class="fa-solid fa-layer-group statIcon"></i>
</div>

<div class="statCard">
<h3>Administrativos</h3>
<div class="statNumber" id="totalAdmins">0</div>
<i class="fa-solid fa-user-gear statIcon"></i>
</div>

</div>


<!-- GRAFICA -->

<div class="card dashboardStatsCard">

<h2>Estadísticas del Sistema</h2>

<canvas id="graficaDashboard"></canvas>

</div>


<!-- CURSOS DISPONIBLES -->
<div class="sectionHeader"><h2>Cursos disponibles</h2></div>

<!-- CURSOS DINAMICOS -->

<div class="sectionHeader">
<h2>Cursos del Sistema</h2>
</div>

<div class="courseGrid" id="listaCursos"></div>


<!-- CURSO MAS POPULAR -->

<div class="card">
<h2>Curso más popular</h2>
<div id="cursoPopular">Aún no hay datos</div>
</div>


<!-- ULTIMOS ESTUDIANTES -->

<div class="card">
<h2>Últimos estudiantes registrados</h2>

<table>

<thead>
<tr>
<th>Identificación</th>
<th>Nombre</th>
<th>Teléfono</th>
</tr>
</thead>

<tbody id="ultimosEstudiantes"></tbody>

</table>

</div>


</div>

</div>


<!-- LIBRERIA GRAFICAS -->

<!-- SCRIPT DASHBOARD -->

<script src="js/utils.js"></script>
<script src="js/logout.js"></script>
<script src="js/authGuard.js"></script>
<script src="js/pro.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/nav.js"></script></body>
</html>
