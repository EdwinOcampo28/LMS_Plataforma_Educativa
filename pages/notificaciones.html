<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Notificaciones</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head><body><div class="layout"><div class="sidebar" id="appSidebar"></div><main class="content"><div class="pageHero"><div><span class="eyebrow">CENTRO</span><h1>Notificaciones</h1><p class="hint">Avisos recientes del sistema.</p></div><button class="btn-outline" onclick="marcarTodas()">Marcar todas como leídas</button></div><div id="notifs" class="notificationList"></div></main></div><script src="../js/utils.js"></script><script src="../js/pro.js"></script><script src="../js/logout.js"></script><script src="../js/nav.js"></script>
<script src="../js/authGuard.js"></script><script>function render(){const a=LMSPro.notifications();notifs.innerHTML=a.length?a.map(n=>`<article class="card notification ${n.read?'read':''}"><span class="notificationIcon ${LMSPro.badgeType(n.type)}">🔔</span><div><strong>${LMS.escapeHTML(n.title)}</strong><p>${LMS.escapeHTML(n.message)}</p><small>${new Date(n.date).toLocaleString('es-CO')}</small></div>${!n.read?`<button class="btn-outline" onclick="leer('${n.id}')">Leída</button>`:''}</article>`).join(''):LMS.emptyState('No tienes notificaciones.')}function leer(id){LMSPro.markRead(id);render()}function marcarTodas(){const a=LMSPro.notifications();a.forEach(n=>n.read=true);LMS.save('notificaciones',a);render();LMS.notify('Todas las notificaciones están leídas.')}render();</script></body></html>
