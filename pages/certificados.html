<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificados | LMS</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="layout"><div class="sidebar" id="appSidebar"></div><main class="content"><div class="pageHero"><div><span class="eyebrow">ACREDITACIÓN</span><h1>Certificados</h1><p class="hint">Consulta, valida, revoca o restaura los certificados emitidos por el LMS.</p></div><div class="heroActions"><a class="btn-outline" href="../certificado.html"><i class="fa-solid fa-magnifying-glass"></i> Verificar certificado</a></div></div><section class="certificateHero"><div class="card certificateMetric"><span class="eyebrow">VIGENTES</span><strong id="activeCount">0</strong><span class="hint">Certificados actualmente válidos</span></div><div class="card certificateMetric"><span class="eyebrow">REVOCADOS</span><strong id="revokedCount">0</strong><span class="hint">Certificados que ya no están vigentes</span></div></section><section class="card" style="margin-top:20px"><div class="tableWrap"><table><thead><tr><th>Certificado</th><th>Estudiante</th><th>Curso</th><th>Nota</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="certRows"></tbody></table></div></section></main></div><script src="../js/utils.js"></script><script src="../js/pro.js"></script><script src="../js/logout.js"></script><script src="../js/nav.js"></script><script src="../js/authGuard.js"></script><script>
function certs(){return LMS.load('certificados',[])}
function student(c){return LMS.load('estudiantes',[]).find(s=>s.codigo===c.estudianteCodigo||s.identificacion===c.estudianteCodigo)||null}
function course(c){return LMS.load('cursos',[]).find(x=>x.codigo===c.cursoCodigo)||null}
function render(){const all=certs();const active=all.filter(c=>!(c.revocado||c.status==='revoked'));const revoked=all.filter(c=>c.revocado||c.status==='revoked');document.getElementById('activeCount').textContent=active.length;document.getElementById('revokedCount').textContent=revoked.length;const rows=document.getElementById('certRows');rows.innerHTML=all.length?all.map(c=>{const s=student(c),co=course(c),isRev=Boolean(c.revocado||c.status==='revoked');return `<tr><td><strong>${LMS.escapeHTML(c.id)}</strong></td><td>${LMS.escapeHTML(`${s?.nombres||''} ${s?.apellidos||''}`.trim()||c.estudianteCodigo)}</td><td>${LMS.escapeHTML(co?.nombre||c.cursoCodigo)}</td><td>${Number(c.nota)||0}%</td><td>${new Date(c.fecha).toLocaleDateString('es-CO')}</td><td><span class="badge ${isRev?'badge-danger':'badge-success'}">${isRev?'Revocado':'Vigente'}</span></td><td><div class="heroActions">${isRev?`<button class="btn-secondary" onclick="restaurar('${LMS.escapeHTML(c.id)}')"><i class="fa-solid fa-rotate-left"></i> Restaurar</button><button class="btn-danger" onclick="eliminar('${LMS.escapeHTML(c.id)}')"><i class="fa-solid fa-trash"></i></button>`:`<button class="btn-outline" onclick="ver('${LMS.escapeHTML(c.id)}')"><i class="fa-solid fa-eye"></i> Ver</button><button class="btn-danger" onclick="revocar('${LMS.escapeHTML(c.id)}')"><i class="fa-solid fa-ban"></i> Revocar</button>`}</div></td></tr>`}).join(''): `<tr><td colspan="7">${LMS.emptyState('Todavía no se ha generado ningún certificado.')}</td></tr>`}
function save(a){LMS.saveRaw('certificados',a);window.dispatchEvent(new CustomEvent('lms:data-change',{detail:{key:'certificados',value:a}}));render()}
function revocar(id){const a=certs();const i=a.findIndex(c=>String(c.id)===String(id));if(i<0)return;LMS.confirmAction('¿Revocar este certificado? Dejará de aparecer como válido.',()=>{a[i]={...a[i],revocado:true,status:'revoked',revocadoEn:new Date().toISOString(),revocadoPor:LMSPro.actor()};save(a);LMSPro.event('REVOCAR','certificado',id,'Certificado revocado',`El certificado ${id} fue revocado.`,'warning','all');LMS.notify('Certificado revocado.','success')})}
function restaurar(id){const a=certs();const i=a.findIndex(c=>String(c.id)===String(id));if(i<0)return;LMS.confirmAction('¿Restaurar este certificado?',()=>{a[i]={...a[i],revocado:false,status:'active',restauradoEn:new Date().toISOString(),restauradoPor:LMSPro.actor()};save(a);LMSPro.event('RESTAURAR','certificado',id,'Certificado restaurado',`El certificado ${id} volvió a estar vigente.`,'success','all');LMS.notify('Certificado restaurado.','success')})}
function eliminar(id){const a=certs();const item=a.find(c=>String(c.id)===String(id));if(!item||(item.revocado||item.status==='revoked')===false)return;LMS.confirmAction('¿Eliminar permanentemente este certificado revocado?',()=>{save(a.filter(c=>String(c.id)!==String(id)));LMSPro.event('ELIMINAR','certificado',id,'Certificado eliminado',`Se eliminó permanentemente el certificado ${id}.`,'warning','all');LMS.notify('Certificado eliminado.','success')})}
function ver(id){
 const c=certs().find(x=>String(x.id)===String(id));if(!c)return;
 const w=window.open('','_blank');if(!w)return LMS.notify('Permite ventanas emergentes para visualizar el certificado.','warning');
 const s=student(c),co=course(c),esc=LMS.escapeHTML;
 if(!co)return LMS.notify('No encontramos el curso asociado al certificado.','error');
 const nombre=`${s?.nombres||''} ${s?.apellidos||''}`.trim()||c.estudianteCodigo;
 const fecha=new Date(c.fecha).toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});
 const verification=`certificado.html?codigo=${encodeURIComponent(c.id)}`;
 w.document.write(`<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(c.id)} · Certificado oficial</title><style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#dfe4ea}
body{font-family:Georgia,'Times New Roman',serif;color:#102342;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{width:297mm;height:210mm;background:#fff;position:relative;overflow:hidden;margin:auto;padding:7mm;box-shadow:0 18px 60px rgba(15,23,42,.22)}
.sheet:before{content:'';position:absolute;inset:4mm;border:1.2mm solid #c69a3b;pointer-events:none}
.sheet:after{content:'';position:absolute;inset:7mm;border:.35mm solid #e3c77b;pointer-events:none}
.corner{position:absolute;width:34mm;height:34mm;border-color:#c69a3b;z-index:2}
.c1{top:9mm;left:9mm;border-top:1mm solid;border-left:1mm solid}.c2{top:9mm;right:9mm;border-top:1mm solid;border-right:1mm solid}.c3{bottom:9mm;left:9mm;border-bottom:1mm solid;border-left:1mm solid}.c4{bottom:9mm;right:9mm;border-bottom:1mm solid;border-right:1mm solid}
.watermark{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font:900 150px Arial,sans-serif;letter-spacing:-12px;color:rgba(198,154,59,.07);z-index:0}
.content{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14mm 22mm 10mm}
.brandline{font:800 11px Arial,sans-serif;letter-spacing:5px;color:#9a6b12;text-transform:uppercase;margin-top:1mm}
.brand{font:900 30px Arial,sans-serif;letter-spacing:1.2px;color:#102a50;margin-top:2mm}.brand span{color:#c69a3b}
.eyebrow{font:800 10px Arial,sans-serif;letter-spacing:3px;color:#6b5a32;margin-top:3mm;text-transform:uppercase}
.ornament{display:flex;align-items:center;gap:4mm;width:105mm;margin-top:4mm;color:#c69a3b}.ornament i{height:.35mm;background:#d4bb76;flex:1}.ornament b{font-size:18px;font-weight:400}
h1{font-size:34px;letter-spacing:2px;font-weight:500;color:#102a50;margin:3mm 0 1mm}
.subtitle{font:700 10px Arial,sans-serif;letter-spacing:1.5px;color:#5b6575;text-transform:uppercase}
.name{font-size:40px;font-weight:700;color:#102a50;margin:6mm 0 2mm;padding:0 18mm 2mm;border-bottom:.35mm solid #c6a75a;min-width:100mm}
.statement{max-width:195mm;font-size:13px;line-height:1.5;color:#39485f;margin:2mm 0 3mm}
.course{font-size:27px;font-weight:700;color:#a66f08;max-width:210mm;margin:0 0 3mm}
.meta{display:grid;grid-template-columns:repeat(3,1fr);width:178mm;border-top:.25mm solid #e2d7bb;border-bottom:.25mm solid #e2d7bb;margin-top:2mm;padding:4mm 0;font-family:Arial,sans-serif}
.metric{padding:0 8mm;border-right:.25mm solid #e0d8c7}.metric:last-child{border-right:0}.metric strong{display:block;font-size:18px;color:#102a50;line-height:1.2}.metric small{display:block;margin-top:1.5mm;font-size:8.5px;letter-spacing:1.3px;color:#5f6b7d;text-transform:uppercase}
.bottom{width:178mm;display:grid;grid-template-columns:1fr 34mm 1fr;align-items:end;gap:10mm;margin-top:auto;padding-bottom:2mm}
.signature{border-top:.25mm solid #7f8794;padding-top:2mm;font-family:Arial,sans-serif}.signature strong{display:block;font:600 11px Georgia,serif;color:#102a50}.signature small{display:block;font-size:8px;color:#5f6b7d;margin-top:1mm}
.seal{width:28mm;height:28mm;border:1mm double #b38a32;border-radius:50%;display:grid;place-items:center;color:#a66f08;background:#fffdf7;font:900 8px Arial,sans-serif;line-height:1.25;transform:rotate(-7deg);position:relative}.seal:before{content:'★';position:absolute;top:3mm;font-size:9px}.seal span{padding-top:4mm}.seal em{display:block;font-style:normal;font-size:5px;letter-spacing:1px}
.footer{position:absolute;left:23mm;right:23mm;bottom:8.5mm;display:flex;justify-content:space-between;gap:8mm;font:7.5px Arial,sans-serif;color:#5b6575}.footer .code{font-weight:800;color:#334766}.verify{color:#40516a}
.printBar{position:fixed;top:12px;right:12px;background:#172033;color:#fff;padding:10px 14px;border-radius:8px;font:700 11px Arial,sans-serif;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.18)}
@media print{html,body{background:#fff}.sheet{margin:0;box-shadow:none}.printBar{display:none}}
@media screen and (max-width:900px){body{background:#dfe4ea;padding:10px}.sheet{box-shadow:0 12px 35px rgba(15,23,42,.2)}}
</style></head><body><div class="printBar">Certificado oficial · A4 horizontal</div><main class="sheet"><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div><div class="watermark">EDUNOVA</div><section class="content"><div class="brandline">Plataforma educativa</div><div class="brand">EDUNOVA</div><div class="eyebrow">Certificado académico oficial</div><div class="ornament"><i></i><b>✦</b><i></i></div><h1>Se certifica que</h1><div class="subtitle">ha cumplido satisfactoriamente los requisitos académicos</div><div class="name">${esc(nombre)}</div><p class="statement">Ha completado satisfactoriamente el programa formativo y aprobado los requisitos establecidos para obtener el certificado correspondiente a:</p><div class="course">${esc(co.nombre)}</div><div class="meta"><div class="metric"><strong>${Number(c.nota)||0}%</strong><small>Calificación final</small></div><div class="metric"><strong>${esc(fecha)}</strong><small>Fecha de emisión</small></div><div class="metric"><strong>${esc(co.codigo)}</strong><small>Código del curso</small></div></div><div class="bottom"><div class="signature"><strong>Autoridad académica</strong><small>Plataforma Educativa EDUNOVA</small></div><div class="seal"><span>★<br>EDUNOVA<em>VERIFICADO</em></span></div><div class="signature"><strong>Registro académico</strong><small>Documento emitido y verificable digitalmente</small></div></div></section><div class="footer"><span class="code">Código: ${esc(c.id)}</span><span class="verify">Verificación: ${esc(verification)}</span><span>Documento oficial · EDUNOVA · 2026</span></div></main><script>window.addEventListener('load',()=>setTimeout(()=>window.print(),500))<\/script></body></html>`);w.document.close();
}
render();window.addEventListener('lms:data-change',e=>{if(e.detail?.key==='certificados')render()});
</script></body></html>
