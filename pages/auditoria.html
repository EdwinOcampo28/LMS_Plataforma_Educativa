<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Auditoría</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head><body><div class="layout"><div class="sidebar" id="appSidebar"></div><main class="content"><div class="pageHero"><div><span class="eyebrow">CONTROL</span><h1>Auditoría</h1><p class="hint">Historial de acciones administrativas.</p></div></div><div class="card"><div class="tableWrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Detalle</th></tr></thead><tbody id="audit"></tbody></table></div></div></main></div><script src="../js/utils.js"></script><script src="../js/pro.js"></script><script src="../js/logout.js"></script><script src="../js/nav.js"></script>
<script src="../js/authGuard.js"></script><script>const a=LMS.load('auditoria',[]);audit.innerHTML=a.length?a.map(x=>`<tr><td>${new Date(x.date).toLocaleString('es-CO')}</td><td>${LMS.escapeHTML(x.user)}</td><td><span class="badge badge-primary">${LMS.escapeHTML(x.action)}</span></td><td>${LMS.escapeHTML(x.entity)}</td><td>${LMS.escapeHTML(x.detail)}</td></tr>`).join(''):`<tr><td colspan="5">${LMS.emptyState('Todavía no hay movimientos registrados.')}</td></tr>`;</script></body></html>
