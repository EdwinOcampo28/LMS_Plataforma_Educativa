<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Notificaciones</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head><body><div class="layout"><div class="sidebar" id="appSidebar"></div><main class="content"><div class="pageHero"><div><span class="eyebrow">CENTRO</span><h1>Notificaciones</h1><p class="hint">Avisos recientes del sistema.</p></div><div class="heroActions"><button type="button" class="btn-outline" onclick="marcarTodas()">Marcar todas como leídas</button><button type="button" class="btn-danger" onclick="eliminarLeidas()"><i class="fa-solid fa-trash"></i> Eliminar leídas</button></div></div><div id="notificationSummary" class="notificationSummary"></div><div id="notifs" class="notificationList"></div></main></div><script src="../js/utils.js"></script><script src="../js/pro.js"></script><script src="../js/logout.js"></script><script src="../js/nav.js"></script>
<script src="../js/authGuard.js"></script><script>
function render(){const a=LMSPro.backfillFromAudit();const root=document.getElementById('notifs');const summary=document.getElementById('notificationSummary');const unread=a.filter(n=>!n.read).length;summary.innerHTML=`<div class="card notificationSummaryCard"><div><span class="eyebrow">CENTRO DE AVISOS</span><h2>${unread?`${unread} notificación${unread===1?'':'es'} pendiente${unread===1?'':'s'}`:'Todo al día'}</h2><p class="hint">Los avisos se generan automáticamente cuando ocurre una acción importante en EDUNOVA.</p></div><div class="notificationSummaryIcon"><i class="fa-solid fa-bell"></i></div></div>`;root.innerHTML=a.length?a.map(n=>`<article class="card notification ${n.read?'read':''}"><span class="notificationIcon ${LMSPro.badgeType(n.type)}">🔔</span><div><strong>${LMS.escapeHTML(n.title)}</strong><p>${LMS.escapeHTML(n.message)}</p><small>${new Date(n.date).toLocaleString('es-CO')}</small></div><div class="notificationActions">${!n.read?`<button type="button" class="btn-outline" data-read="${LMS.escapeHTML(n.id)}">Marcar como leída</button>`:`<button type="button" class="btn-danger btn-sm" data-delete="${LMS.escapeHTML(n.id)}" title="Eliminar notificación"><i class="fa-solid fa-trash"></i> Eliminar</button>`}</div></article>`).join(''):LMS.emptyState('No tienes notificaciones.')}
function leer(id){LMSPro.markRead(id);render();LMS.notify('Notificación marcada como leída.')}
function eliminarNotificacion(id){const n=LMSPro.notifications().find(v=>String(v.id)===String(id));if(!n)return;if(!n.read){LMS.notify('Primero debes marcarla como leída.','warning');return;}LMS.confirmAction('¿Eliminar esta notificación? Esta acción no afecta el sistema.',()=>{LMSPro.removeRead(id);render();LMS.notify('Notificación eliminada.')})}
function marcarTodas(){const a=LMSPro.notifications();if(!a.some(n=>!n.read)){LMS.notify('No hay notificaciones pendientes.','warning');return;}LMSPro.markAllRead();render();LMS.notify('Todas las notificaciones están leídas.')}
function eliminarLeidas(){const a=LMSPro.notifications();const count=a.filter(n=>n.read).length;if(!count){LMS.notify('No hay notificaciones leídas para eliminar.','warning');return;}LMS.confirmAction(`¿Eliminar las ${count} notificación(es) leída(s)?`,()=>{LMSPro.removeAllRead();render();LMS.notify('Notificaciones leídas eliminadas.');})}
document.addEventListener('click',e=>{const read=e.target.closest('[data-read]');if(read)leer(read.dataset.read);const del=e.target.closest('[data-delete]');if(del)eliminarNotificacion(del.dataset.delete);});
render();
window.addEventListener('lms:data-change',e=>{if(e.detail?.key==='notificaciones'||e.detail?.key==='auditoria')render()});
window.addEventListener('storage',e=>{if(e.key==='notificaciones'||e.key==='auditoria'||e.key==='lms_notificacion_eliminada')render()});</script></body></html>
