<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Cursos</title>

<link rel="stylesheet" href="../css/styles.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<h1>Gestión de Cursos</h1>

<!-- ================= CURSOS ================= -->

<form id="cursoForm">

<input id="codigo" placeholder="Código" required>

<input id="nombre" placeholder="Nombre" required>

<input id="descripcion" placeholder="Descripción" required>

<!-- DOCENTE -->

<div class="select-box">
<i class="fa-solid fa-user-tie"></i>
<select id="docente" required>
<option value="">Seleccionar docente</option>
</select>
</div>

<!-- ESTUDIANTE -->

<div class="select-box">
<i class="fa-solid fa-user-graduate"></i>
<select id="estudiante" required>
<option value="">Seleccionar estudiante</option>
</select>
</div>

<input id="duracion" placeholder="Duración (ej: 10 horas)">

<input id="etiquetas" placeholder="Etiquetas (Python, Backend)">

<!-- ESTADO -->

<div class="select-box">
<i class="fa-solid fa-toggle-on"></i>
<select id="estado" required>
<option value="">Seleccionar estado</option>
<option value="Activo">Activo</option>
<option value="Inactivo">Inactivo</option>
</select>
</div>

<!-- CATEGORIA (NECESARIA PARA TU JS) -->

<div class="select-box">
<i class="fa-solid fa-tags"></i>
<select id="categoria" required>
<option value="">Seleccionar categoría</option>
<option value="Tecnología">Tecnología</option>
<option value="Matemáticas">Matemáticas</option>
<option value="Idiomas">Idiomas</option>
<option value="Ciencias">Ciencias</option>
</select>
</div>

<button type="submit">
<i class="fa-solid fa-floppy-disk"></i>
Guardar Curso
</button>

</form>


<!-- ================= TABLA CURSOS ================= -->

<table>

<thead>
<tr>
<th>Código</th>
<th>Nombre</th>
<th>Docente</th>
<th>Estudiante</th>
<th>Duración</th>
<th>Etiquetas</th>
<th>Estado</th>
<th>Módulos</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaCursos"></tbody>

</table>


<!-- ================= MODULOS ================= -->

<h2>Módulos</h2>

<form id="moduloForm">

<div class="select-box">
<i class="fa-solid fa-book"></i>
<select id="cursoModulo" required>
<option value="">Seleccionar curso</option>
</select>
</div>

<input id="moduloNombre" placeholder="Nombre módulo" required>

<button type="submit">
<i class="fa-solid fa-layer-group"></i>
Guardar módulo
</button>

</form>


<h3>Listado General de Módulos</h3>

<table>

<thead>
<tr>
<th>Curso</th>
<th>Módulo</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaModulos"></tbody>

</table>


<!-- ================= LECCIONES ================= -->

<h2>Lecciones</h2>

<form id="leccionForm">

<div class="select-box">
<i class="fa-solid fa-book"></i>
<select id="cursoLeccion" required>
<option value="">Seleccionar curso</option>
</select>
</div>

<div class="select-box">
<i class="fa-solid fa-layer-group"></i>
<select id="moduloLeccion" required>
<option value="">Seleccionar módulo</option>
</select>
</div>

<input id="titulo" placeholder="Título" required>

<input id="contenido" placeholder="Contenido" required>

<button type="submit">
<i class="fa-solid fa-plus"></i>
Agregar lección
</button>

</form>


<h3>Listado de Lecciones</h3>

<table>

<thead>
<tr>
<th>Curso</th>
<th>Módulo</th>
<th>Título</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaLecciones"></tbody>

</table>

<script src="../js/cursos.js"></script>

</body>

</html>
