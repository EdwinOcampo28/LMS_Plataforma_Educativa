<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Verificar certificado</title><link rel="stylesheet" href="css/styles.css"></head><body class="center"><main class="card login"><span class="eyebrow">VALIDACIÓN</span><h1>Verificar certificado</h1><p class="hint">Introduce el código del certificado para comprobar su autenticidad.</p><form id="verifyForm"><input id="certCode" placeholder="Ej. CERT-123..." required><button>Verificar</button></form><div id="result"></div><a href="index.html">Volver al inicio</a></main><script src="js/utils.js"></script><script>verifyForm.addEventListener('submit',e=>{e.preventDefault();const code=certCode.value.trim();const c=LMS.load('certificados').find(x=>x.id===code);if(!c)return result.innerHTML='<div class="verifyFail">❌ Certificado no encontrado.</div>';const s=LMS.load('estudiantes').find(x=>x.codigo===c.estudianteCodigo);const course=LMS.load('cursos').find(x=>x.codigo===c.cursoCodigo);result.innerHTML=`<div class="verifySuccess"><strong>✓ Certificado válido</strong><p>Estudiante: ${LMS.escapeHTML(`${s?.nombres||''} ${s?.apellidos||''}`)}</p><p>Curso: ${LMS.escapeHTML(course?.nombre||c.cursoCodigo)}</p><p>Nota: ${c.nota}% · Fecha: ${new Date(c.fecha).toLocaleDateString('es-CO')}</p><small>${LMS.escapeHTML(c.id)}</small></div>`});</script></body></html>
